[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelai"
version = "0.2.0"
description = "Research framework for small-object detection in aerial and remote sensing imagery"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=1.12.0",
    "torchvision>=0.13.0",
    "ultralytics>=8.0.0",
    "pyyaml>=6.0",
    "numpy>=1.21.0",
    "pandas>=1.4.0",
    "opencv-python-headless>=4.6.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "ensemble-boxes>=1.0.9",
    "scipy>=1.8.0",
    "pytest>=7.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]
